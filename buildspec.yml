version: 0.2

# CodeBuild buildspec: headless Kiro CLI remediation for claims-api.
#
# Triggered by the remediation trigger Lambda when a DevOps Agent
# "Mitigation Completed" event lands. The mitigation payload arrives as the
# MITIGATION_PAYLOAD env var (JSON). Kiro CLI, guided by
# .kiro/steering/remediation-agent.md, applies the minimal fix to
# app/validation.py and/or app/query.sql. Guardrails then validate the diff
# before a branch is pushed and a GitHub pull request is opened.
#
# Required env (from the CodeBuild project / trigger Lambda):
#   MITIGATION_PAYLOAD, GITHUB_OWNER, GITHUB_REPO, GITHUB_PAT_SECRET,
#   KIRO_API_KEY_SECRET, AWS_REGION (provided by CodeBuild)

env:
  shell: bash

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - echo "INSTALL - fetch secrets and Kiro CLI"
      - export GITHUB_PAT="$(aws secretsmanager get-secret-value --secret-id "$GITHUB_PAT_SECRET" --query SecretString --output text)"
      - export KIRO_API_KEY="$(aws secretsmanager get-secret-value --secret-id "$KIRO_API_KEY_SECRET" --query SecretString --output text)"
      - curl -fsSL https://cli.kiro.dev/install | bash
      - export PATH="$HOME/.local/bin:$PATH"
      - command -v kiro-cli
      - kiro-cli --version || true
      - kiro-cli settings chat.defaultModel "${KIRO_MODEL:-claude-sonnet-4.5}" || true

  pre_build:
    commands:
      - echo "PRE_BUILD - generate Kiro prompt from mitigation payload"
      - chmod +x bridge/guardrails.sh bridge/open_pr.sh
      - printf '%s' "$MITIGATION_PAYLOAD" > /tmp/mitigation.json
      - python3 bridge/prompt_generator.py /tmp/mitigation.json > /tmp/kiro_prompt.txt
      - cat /tmp/kiro_prompt.txt

  build:
    commands:
      - echo "BUILD - run headless Kiro CLI"
      - export PATH="$HOME/.local/bin:$PATH"
      - export KIRO_API_KEY="$(aws secretsmanager get-secret-value --secret-id "$KIRO_API_KEY_SECRET" --query SecretString --output text)"
      - kiro-cli chat --no-interactive --trust-tools=read,write,grep "$(cat /tmp/kiro_prompt.txt)"

  post_build:
    commands:
      - echo "POST_BUILD - guardrails then branch + PR"
      - bash bridge/guardrails.sh
      - export GITHUB_PAT="$(aws secretsmanager get-secret-value --secret-id "$GITHUB_PAT_SECRET" --query SecretString --output text)"
      - bash bridge/open_pr.sh
